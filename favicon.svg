<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Alaino">
  <defs>
    <linearGradient id="alainoFaviconBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1f4a"/>
      <stop offset="1" stop-color="#07112a"/>
    </linearGradient>
    <linearGradient id="alainoFaviconStroke" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00d4ff"/>
